[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rotate"
version = "0.1.0"
description = "Keep native Claude Code and Codex sessions running across subscription quotas"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "aiohttp>=3.12,<4",
  "claude-rotate @ git+https://github.com/evrenverse/claude-rotate@d650deb5ac645cd9f01f400d58c44394e8dba996",
]

[project.scripts]
agent-rotate = "agent_rotate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-aiohttp>=1", "ruff>=0.12"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rotate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
